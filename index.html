<<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cartoon World - Cartoons From Every Country</title>
<script async="async" data-cfasync="false" src="https://bancadeltempoidea.org/21/63229b988a5c882a64bf61d0e9b82920"></script>
<style>
:root{--bg:#0b1020;--panel:#151d35;--panel2:#1d2948;--text:#f7f8ff;--muted:#aab5d2;--pink:#ff5ca8;--blue:#55c7ff;--yellow:#ffd166}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:radial-gradient(circle at 15% 0%,#243b68 0,#0b1020 42%);color:var(--text)}
header{padding:22px clamp(16px,5vw,70px);display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.logo{font-weight:900;font-size:23px;letter-spacing:.4px}.logo span{color:var(--yellow)}
nav a{color:var(--muted);text-decoration:none;margin-left:18px;font-weight:700}
.hero{padding:48px clamp(16px,5vw,70px) 36px;display:grid;grid-template-columns:1.3fr .7fr;gap:25px;align-items:center}
.tag{display:inline-block;background:#26375d;color:#9fe4ff;padding:8px 13px;border-radius:30px;font-size:12px;font-weight:800;letter-spacing:1px}
h1{font-size:clamp(38px,6vw,70px);line-height:1.02;margin:18px 0}.hero p{color:var(--muted);font-size:17px;line-height:1.6;max-width:620px}
.hero-art{background:linear-gradient(145deg,#ffcc70,#ff6b9c 55%,#8d6bff);border-radius:30px;min-height:230px;display:grid;place-items:center;font-size:100px;box-shadow:0 25px 70px #0006}
.searchbar{margin:10px clamp(16px,5vw,70px) 25px;display:flex;gap:10px;background:var(--panel);padding:10px;border:1px solid #344365;border-radius:16px}
.searchbar input{flex:1;min-width:0;background:transparent;border:0;outline:0;color:white;padding:12px;font-size:16px}
button,.country{cursor:pointer;border:0;border-radius:12px;padding:12px 17px;font-weight:800;background:var(--blue);color:#071322}
main{padding:12px clamp(16px,5vw,70px) 60px}.section-head{display:flex;align-items:end;justify-content:space-between;gap:15px;flex-wrap:wrap;margin:22px 0 16px}
h2{font-size:26px;margin:0}.section-head p{margin:6px 0 0;color:var(--muted)}
.filters{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:24px}.country{background:#202c49;color:#dce6ff;border:1px solid #354667}.country.active{background:var(--yellow);color:#172033;border-color:var(--yellow)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.card{background:linear-gradient(160deg,#1b2744,#111a30);border:1px solid #2b3a5c;border-radius:20px;overflow:hidden;transition:.2s}.card:hover{transform:translateY(-4px);border-color:#5b8dbb}
.thumb{height:135px;display:grid;place-items:center;font-size:58px;background:linear-gradient(135deg,#344f80,#713f86)}
.card-body{padding:16px}.card h3{margin:0 0 7px;font-size:18px}.card p{margin:0 0 14px;color:var(--muted);font-size:13px;line-height:1.5}
.watch{display:inline-block;text-decoration:none;background:var(--pink);color:#21091a;padding:10px 13px;border-radius:10px;font-size:13px;font-weight:900}
.note{margin-top:28px;padding:18px;background:#111a30;border:1px solid #2b3a5c;border-radius:16px;color:var(--muted);line-height:1.
